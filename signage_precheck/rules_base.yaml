# ============================================================================
# БАЗА ПРАВИЛ ДИЗАЙН-КОДА — ПРИМЕРНАЯ / РЕДАКТИРУЕМАЯ
# ----------------------------------------------------------------------------
# Это демонстрационный набор базовых правил для вывесок и наружной рекламы.
# ЗАМЕНИТЕ его содержимое на ваши реальные правила дизайн-кода.
#
# Формат каждого правила:
#   id           — короткий уникальный код (используется агентом как ссылка)
#   category     — категория (размеры, материалы, подсветка, размещение и т.д.)
#   title        — краткое название правила
#   requirement  — суть требования (что должно/не должно быть)
#   reference    — ссылка на пункт документа / нормативный источник
#   severity     — базовая значимость нарушения: низкая | средняя | высокая
# ============================================================================

meta:
  name: "Дизайн-код: вывески и наружная реклама (демо)"
  version: "0.1-sample"
  source: "ПРИМЕР — заменить на реальный документ дизайн-кода"

rules:
  # --- РАЗМЕРЫ И ГАБАРИТЫ -------------------------------------------------
  - id: SIZE-01
    category: "Размеры"
    title: "Высота настенной вывески"
    requirement: >
      Высота настенной вывески (информационной конструкции) не должна
      превышать 0,5 м. Для отдельных объектов высота согласовывается отдельно.
    reference: "Дизайн-код, п. 3.1"
    severity: средняя

  - id: SIZE-02
    category: "Размеры"
    title: "Длина вывески относительно фасада"
    requirement: >
      Суммарная длина вывесок не должна превышать 70% длины фасада входной
      группы и не должна выходить за границы помещения, занимаемого заявителем.
    reference: "Дизайн-код, п. 3.2"
    severity: средняя

  # --- РАЗМЕЩЕНИЕ ---------------------------------------------------------
  - id: PLACE-01
    category: "Размещение"
    title: "Высота размещения по фасаду"
    requirement: >
      Вывеска размещается в пределах входной группы / первого этажа, не выше
      линии перекрытия между первым и вторым этажами и ниже линии окон второго
      этажа. Размещение выше второго этажа не допускается.
    reference: "Дизайн-код, п. 4.1"
    severity: высокая

  - id: PLACE-02
    category: "Размещение"
    title: "Перекрытие архитектурных элементов"
    requirement: >
      Запрещается перекрывать вывесками архитектурные элементы фасада:
      пилястры, карнизы, наличники, лепнину, декоративные пояса, оконные и
      дверные проёмы.
    reference: "Дизайн-код, п. 4.3"
    severity: высокая

  - id: PLACE-03
    category: "Размещение"
    title: "Количество вывесок на один объект"
    requirement: >
      На одной входной группе допускается не более одной настенной вывески и
      одной консольной (панель-кронштейн) вывески на каждого заявителя.
    reference: "Дизайн-код, п. 4.5"
    severity: средняя

  # --- МАТЕРИАЛЫ И КОНСТРУКЦИЯ -------------------------------------------
  - id: MAT-01
    category: "Материалы"
    title: "Запрещённые типы конструкций"
    requirement: >
      Запрещены баннерные конструкции из ПВХ-ткани, сплошные световые короба
      (лайтбоксы) с внутренней подсветкой всей плоскости, а также конструкции
      из дешёвого пластика. Допускаются объёмные буквы, плоские буквы,
      накладные элементы из качественных материалов (металл, дерево, акрил).
    reference: "Дизайн-код, п. 5.1"
    severity: высокая

  - id: MAT-02
    category: "Материалы"
    title: "Крепление конструкции"
    requirement: >
      Элементы крепления, провода и кабель-каналы должны быть скрыты или
      окрашены в цвет фасада. Видимые подводки питания не допускаются.
    reference: "Дизайн-код, п. 5.4"
    severity: низкая

  # --- ПОДСВЕТКА ---------------------------------------------------------
  - id: LIGHT-01
    category: "Подсветка"
    title: "Тип подсветки"
    requirement: >
      Допускается контражурная подсветка и подсветка отдельных световых букв.
      Запрещается мигающая, бегущая, динамическая подсветка и засветка всей
      плоскости вывески.
    reference: "Дизайн-код, п. 6.1"
    severity: средняя

  # --- ОФОРМЛЕНИЕ / ТИПОГРАФИКА ------------------------------------------
  - id: STYLE-01
    category: "Оформление"
    title: "Цвет и контраст"
    requirement: >
      Цветовое решение вывески должно быть согласовано с колористикой фасада.
      Запрещены кислотные / неоновые цвета фона, перегруженные многоцветные
      композиции. Рекомендуется не более 2–3 цветов.
    reference: "Дизайн-код, п. 7.2"
    severity: низкая

  - id: STYLE-02
    category: "Оформление"
    title: "Содержание вывески"
    requirement: >
      Вывеска должна содержать только наименование организации и/или вид
      деятельности. Размещение телефонов, сайтов, перечня товаров и рекламных
      слоганов на вывеске не допускается (это уже реклама, не вывеска).
    reference: "Дизайн-код, п. 7.5"
    severity: средняя

  # --- ИСТОРИЧЕСКАЯ СРЕДА -------------------------------------------------
  - id: HIST-01
    category: "Историческая среда"
    title: "Объекты культурного наследия"
    requirement: >
      Для зданий-памятников и зданий в границах исторических зон действуют
      повышенные требования; любое размещение требует отдельного согласования
      с органом охраны объектов культурного наследия.
    reference: "Дизайн-код, п. 8.1"
    severity: высокая
